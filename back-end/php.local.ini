; Local development overrides for PHP.
; Mirrors the values in php.ini but adds a CA bundle so cURL can verify HTTPS
; certificates. Without it every outbound HTTPS call (VNPay querydr, IPN
; verification, OSRM routing) fails with "cURL error 60: unable to get local
; issuer certificate" and payments stay PENDING forever.
curl.cainfo = D:\LVTN-QLNH-MiCay\LVTN-QLNH\back-end\storage\app\cacert.pem
openssl.cafile = D:\LVTN-QLNH-MiCay\LVTN-QLNH\back-end\storage\app\cacert.pem
